{% extends 'acervo/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Membros</h2>
    <a href="{% url 'criar_membro' %}" class="btn btn-primary">+ Novo Membro</a>
</div>
<div class="card shadow-sm"><div class="card-body">
    <table class="table table-striped">
        <thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th></tr></thead>
        <tbody>
            {% for m in membros %}
            <tr><td>{{ m.nome }}</td><td>{{ m.email }}</td><td>{{ m.telefone }}</td></tr>
            {% empty %}
            <tr><td colspan="3" class="text-center text-muted">Nenhum membro cadastrado.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div></div>
{% endblock %}
